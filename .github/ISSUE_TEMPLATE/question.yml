name: ❔ Question
description: Ask how to install, configure or use a plugin.
title: "[Question] <short summary>"
labels: ["type: question", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Happy to help! 👋 The [docs](https://github.com/nerymurillohnd/the-claude-factory/tree/main/docs) and the [FAQ](https://github.com/nerymurillohnd/the-claude-factory/blob/main/docs/faq.md) answer the most common questions.

  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: The plugin your question is about, if any.
      options:
        - None (marketplace question)
        - bash-lsp-intelligence
        - block-no-verify
        - file-tree-pane
        - github-operations
        - hook-engineering
        - instruction-engineering
        - macos-grep-guard
        - model-trace
        - mods-engineering
        - plugin-engineering
        - plugin-evals
        - plugin-test-bench
        - project-maintainer
        - prompt-writer
        - python-lsp-intelligence
        - skill-diagnostics
        - svelte-development
        - tailwind-development
        - tool-ledger
        - turn-meter
        - typescript6-lsp-intelligence
        - typescript7-lsp-intelligence

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`, or "Claude".
