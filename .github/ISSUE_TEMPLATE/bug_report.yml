name: 🐞 Bug report
description: A plugin doesn't install, load or behave as documented.
title: "[Bug] <plugin>: <short summary>"
labels: ["type: bug", "status: triage"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! 🙏 A precise report gets a precise fix.

        > **Before you start:** update the plugin (`claude plugin update <plugin>@the-claude-factory`) and check [Troubleshooting](https://github.com/nerymurillohnd/the-claude-factory/blob/main/docs/troubleshooting.md).
        > Found a **security** problem? Please [report it privately](https://github.com/nerymurillohnd/the-claude-factory/security/advisories/new) instead.

  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: The plugin this report is about, as in `<plugin>@the-claude-factory`.
      options:
        - bash-lsp-intelligence
        - block-no-verify
        - file-tree-pane
        - github-operations
        - hook-engineering
        - instruction-engineering
        - macos-grep-guard
        - model-trace
        - mods-engineering
        - plugin-engineering
        - plugin-evals
        - plugin-test-bench
        - project-maintainer
        - prompt-writer
        - python-lsp-intelligence
        - skill-diagnostics
        - svelte-development
        - tailwind-development
        - tool-ledger
        - turn-meter
        - typescript6-lsp-intelligence
        - typescript7-lsp-intelligence
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown by `claude plugin list`.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`. Only in Claude, write "Claude" and your desktop app version or "web" / "mobile".
      placeholder: e.g. 2.1.300 (Claude Code)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - Terminal (CLI)
        - Claude desktop app — Code tab
        - VS Code extension
        - JetBrains
        - Claude Code on the web (cloud session)
        - Claude — desktop app
        - Claude — web
        - Claude — mobile
        - Non-interactive (claude -p / Agent SDK / CI)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: The plugins support macOS and Linux. Windows is supported only through Git Bash, and only for plugins whose README says so.
      options:
        - macOS
        - Linux
        - Windows (Git Bash)
        - Other (not supported)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Paste error messages verbatim.
      placeholder: When I run `/plugin-name:skill`, Claude …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - "Yes, it worked in an earlier version"
        - "No, it never worked"
        - "I don't know"
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last version that worked
      description: Only if it worked before. The plugin version, from `claude plugin list`.
      placeholder: e.g. 1.1.0

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks my work, with no workaround
        - Blocks my work, but a workaround exists
        - Annoying, but I can work normally
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste the output of `claude plugin details <plugin>` and anything listed in `/plugin` → **Errors**. Remove secrets and personal data first.
      render: text

  - type: upload
    id: attachments
    attributes:
      label: Logs or screenshots
      description: Optional. Remove tokens, keys and personal data from every file first.
    validations:
      accept: ".log,.txt,.json,.png,.jpg,.zip"

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest version of the plugin.
          required: true
        - label: I removed tokens, keys and personal data from everything above.
          required: true
