name: ✨ Feature request
description: Suggest an improvement to an existing plugin.
title: "[Feature] <plugin>: <short summary>"
labels: ["type: enhancement", "status: triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Great ideas start with a real problem. Tell us what slows you down — we'll figure out the best way to solve it. 💡
        Have an idea for a **brand-new plugin**? Use [Plugin idea](https://github.com/nerymurillohnd/the-claude-factory/issues/new?template=plugin_idea.yml) instead.

  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: The plugin to improve, as in `<plugin>@the-claude-factory`.
      options:
        - bash-lsp-intelligence
        - block-no-verify
        - file-tree-pane
        - github-operations
        - hook-engineering
        - instruction-engineering
        - macos-grep-guard
        - model-trace
        - mods-engineering
        - plugin-engineering
        - plugin-evals
        - plugin-test-bench
        - project-maintainer
        - prompt-writer
        - python-lsp-intelligence
        - skill-diagnostics
        - svelte-development
        - tailwind-development
        - tool-ledger
        - turn-meter
        - typescript6-lsp-intelligence
        - typescript7-lsp-intelligence
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the plugin falls short today.
      placeholder: Every time I …, I have to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you'd love to see. Examples of commands or output help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or other tools that do this well.

  - type: dropdown
    id: surface
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Claude Code (terminal, desktop, IDE)
        - Claude (web, desktop, mobile)

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been requested yet.
          required: true
