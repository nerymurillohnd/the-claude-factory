# Findings this repository accepts on purpose, each with its reason. Every other zizmor finding fails
# npm run lint:workflows.
rules:
  # The workflows call this repository's own action and reusable workflow as ./.github/..., which
  # GitHub documents. zizmor recommends the newer $/... form, but actionlint 1.7.12, which
  # lint:workflows also runs, rejects it as an invalid action reference.
  self-repository:
    ignore:
      - validate.yml
      - evals.yml
  # npm 12.2.1 is installed by its exact version because devEngines requires npm ^12.2.1 and Node 26
  # ships npm 11; no lockfile can hold the npm that installs the lockfile.
  adhoc-packages:
    ignore:
      - action.yml
  # claude.yml answers @claude mentions, which arrive only as issue_comment and review events.
  # claude-code-action (docs/security.md at the pinned v1.0.276):
  #   - refuses bots and users without write access before Claude starts;
  #   - checks out the pull request's head on a pull request;
  #   - restores .claude/, CLAUDE.md, CLAUDE.local.md and .mcp.json from the base branch first, so a
  #     fork's settings, hooks and instructions never load;
  #   - denies package managers, test runners, interpreters and shells when the pull request's author
  #     has no write access (restrict_untrusted_prs, on by default).
  dangerous-triggers:
    ignore:
      - claude.yml
