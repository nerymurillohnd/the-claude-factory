name: Claude

# Claude answers an @claude mention in an issue, a pull request, a review or a review comment, from
# Anthropic's example (anthropics/claude-code-action, examples/claude.yml). It authenticates with the
# owner's Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret of the `claude` environment
# (`claude setup-token`). The
# action itself refuses bots and users without write access to the repository.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    name: Claude
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # The secret lives in the `claude` environment, so only jobs that name it can read it.
    environment: claude
    permissions:
      contents: write # Claude commits and pushes to the session branch
      pull-requests: write # Claude opens and comments on pull requests
      issues: write # Claude comments on issues
      id-token: write # the action's default GitHub App authentication
      actions: read # Claude reads CI results on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
