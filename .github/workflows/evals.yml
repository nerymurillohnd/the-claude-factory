name: Evals

# Full eval suite of every plugin that ships one: both arms (with and without
# the plugin), three runs per case. Authenticates with the CLAUDE_CODE_OAUTH_TOKEN
# secret (`claude setup-token`), so runs count against that subscription's usage
# limits. Runs when a pull request that changes a plugin's plugin.json is opened,
# reopened or marked ready for review (not on every push), or by hand.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to evaluate (folder name under plugins/), or all"
        default: all

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CLAUDE_CODE_VERSION: "2.1.296"
  # Full model IDs, never aliases, so a model rollout isn't read as a plugin regression.
  EVAL_MODEL: ${{ vars.EVAL_MODEL || 'claude-sonnet-5-5' }}
  EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'claude-opus-5-5' }}

jobs:
  # Secrets can't be read in a job-level `if`, so this job reports whether the
  # token exists and the eval job shows as skipped, not passed, without it.
  token:
    name: Eval token present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then echo "present=true" >>"${GITHUB_OUTPUT}"
          else echo "present=false" >>"${GITHUB_OUTPUT}"; echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; evals skipped."; fi

  evals:
    name: Plugin evals
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Claude Code and the shell sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Run each plugin's full suite
        env:
          ONLY: ${{ inputs.plugin || 'all' }}
        run: .github/scripts/run-evals.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: ignore
