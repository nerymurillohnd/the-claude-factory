name: Evals

# Runs a plugin's eval suite, as .claude/rules/plugins/evals.md sets. Only the plugins the owner
# chose have a suite (plugins/<plugin>/evals/). A pull request triggers this workflow only when it
# changes one of them, or adds a suite: `paths` lists `plugins/*/evals/**` and each plugin with a
# suite, which `npm run check:consistency` (PC-12) keeps in step. Any other pull request doesn't
# start it. workflow_dispatch runs one plugin's whole suite by hand.
# Each effort group runs on its own: the cases on claude-sonnet-5-5, the judge on claude-opus-5-5,
# a case passing at 0.8, at most USD 10 per group, and the suite failing when the plugin's mean
# contribution over no plugin is below 0.2. Every run bills the owner's Claude subscription
# through the CLAUDE_CODE_OAUTH_TOKEN secret of the `claude` environment, never an API key. It
# runs only when the repository variable CLAUDE_EVALS is `enabled`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - plugins/*/evals/**
      - plugins/plugin-engineering/**
      - plugins/project-maintainer/**
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin whose whole suite runs (a marketplace name with an evals/ folder).
        type: string
        required: true

permissions: {}

# A newer push replaces the run still going for an older one.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    name: Select suites
    # Pull requests from forks get no secrets; drafts wait until they are ready.
    if: >-
      vars.CLAUDE_EVALS == 'enabled' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} == workflow_dispatch ]]; then
            candidates="${REQUESTED}"
          else
            candidates="$(git diff --name-only "${BASE_SHA}...HEAD" -- plugins/ | cut -d/ -f2 | sort -u)"
          fi
          selected=()
          for name in ${candidates}; do
            # A changed file directly under plugins/ (a README) or a removed plugin is not a suite.
            if [[ ${EVENT} != workflow_dispatch && ! -f plugins/${name}/.claude-plugin/plugin.json ]]; then
              continue
            fi
            if [[ ! ${name} =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::not a plugin name: ${name}"
              exit 1
            fi
            if compgen -G "plugins/${name}/evals/*/prompt.md" >/dev/null ||
              compgen -G "plugins/${name}/evals/*/case.yaml" >/dev/null; then
              selected+=("${name}")
            elif [[ ${EVENT} == workflow_dispatch ]]; then
              echo "::error::plugins/${name} has no eval suite"
              exit 1
            fi
          done
          echo "Suites: ${selected[*]:-none}"
          plugins="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "plugins=${plugins}" >>"${GITHUB_OUTPUT}"

  eval:
    name: ${{ matrix.plugin }} (effort-${{ matrix.effort }})
    needs: select
    if: needs.select.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The token lives in the `claude` environment, so only jobs that name it can read it.
    environment: claude
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
        effort: [low, medium, high]
    env:
      PLUGIN: ${{ matrix.plugin }}
      EFFORT: ${{ matrix.effort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A group with no case tagged for it would end with "No eval cases found" (exit 1). Tags may
      # be a flow list (`tags: [a, effort-low]`) or a block list (`- effort-low`); Validate's PC-14
      # makes every case carry exactly one known effort tag, so no case falls outside every group.
      - id: cases
        name: Cases tagged effort-${{ matrix.effort }}
        run: |
          set -euo pipefail
          count="$(grep -lE "^tags:.*\beffort-${EFFORT}\b|^[[:space:]]*-[[:space:]]*['\"]?effort-${EFFORT}['\"]?[[:space:]]*$" plugins/"${PLUGIN}"/evals/*/prompt.md plugins/"${PLUGIN}"/evals/*/case.yaml 2>/dev/null | wc -l || true)"
          echo "${count} case(s) tagged effort-${EFFORT}"
          echo "count=${count}" >>"${GITHUB_OUTPUT}"
      - if: steps.cases.outputs.count != '0'
        uses: ./.github/actions/setup
        with:
          toolchain: evals
      - name: claude plugin eval
        if: steps.cases.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          # The owner's subscription pays for evals: an API key would take precedence over the token.
          if [[ -n ${ANTHROPIC_API_KEY:-} ]]; then
            echo "::error::ANTHROPIC_API_KEY is set; evals authenticate only with CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi
          OUT="${RUNNER_TEMP}/eval"
          mkdir -p "${OUT}"
          # Fail closed: never run a suite without the flags .github/evals.json gives it.
          flags=0
          jq -r --arg p "${PLUGIN}" '(.[$p] // []) | if type == "array" then .[] else error("not a list") end' \
            .github/evals.json >"${RUNNER_TEMP}/eval-flags" || flags=$?
          if ((flags != 0)); then
            echo "::error::.github/evals.json can't be read for ${PLUGIN} (jq exit ${flags})"
            exit 1
          fi
          mapfile -t extra <"${RUNNER_TEMP}/eval-flags"
          # The target first: --tag takes a list, so a target after it is read as a tag.
          status=0
          CLAUDE_CODE_EFFORT_LEVEL="${EFFORT}" claude plugin eval "plugins/${PLUGIN}" \
            --tag "effort-${EFFORT}" \
            --model claude-sonnet-5-5 \
            --judge-model claude-opus-5-5 \
            --threshold 0.8 \
            --max-cost-usd 10 \
            --trust-plugin \
            --no-publish \
            --output-dir "${OUT}/report" \
            --json "${OUT}/result.json" \
            "${extra[@]}" || status=$?
          case "${status}" in
            0) ;;
            1) echo "::error::a case scored below 0.8, a case failed to load, or a run ended on an API error"; exit 1 ;;
            2) echo "::error::partial run: the USD 10 ceiling was hit or the token was rejected"; exit 2 ;;
            *) echo "::error::claude plugin eval ended with exit ${status}"; exit "${status}" ;;
          esac
          # The delta never changes the exit code above, so gate on it from the result.
          uv run python scripts/checkers/eval_gate.py "${OUT}/result.json" --min-mean-delta 0.2
      - if: always() && steps.cases.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.plugin }}-effort-${{ matrix.effort }}
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore
          retention-days: 30
