name: Evals

# Runs a plugin's eval suites, as .claude/rules/plugins/evals.md sets
# (https://code.claude.com/docs/en/plugin-evals). Only the plugins the owner chose have a suite:
# plugins/<plugin>/evals/, scored in two arms, and optional extra suites in plugins/<plugin>/evals-*/
# (such as evals-loading/), run with `--eval-dir <dir> --ablation none`. A pull request triggers this
# workflow only when it changes one of them, or adds a suite: `paths` lists `plugins/*/evals/**`,
# `plugins/*/evals-*/**` and each plugin with a suite, which `npm run check:consistency` (PC-12)
# keeps in step. workflow_dispatch runs one plugin's suites by hand.
# Each effort group runs on its own: the cases on claude-sonnet-5-5, the judge on claude-opus-5-5,
# a case passing at 0.8, at most USD 10 per group, 4 runs at a time, and the two-arm suite failing
# when the plugin's mean contribution over no plugin is below 0.2. .github/eval-gates.json can set a
# plugin's own stricter floor, cost cap and concurrency. Every run bills the owner's Claude
# subscription through the CLAUDE_CODE_OAUTH_TOKEN repository secret, never an API key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - plugins/*/evals/**
      - plugins/*/evals-*/**
      - plugins/hook-engineering/**
      - plugins/plugin-engineering/**
      - plugins/project-maintainer/**
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin whose suites run (a marketplace name with an evals/ folder).
        type: string
        required: true

permissions: {}

# A newer push replaces the run still going for an older one.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fork-notice:
    name: Fork pull request
    # GitHub gives no secrets to a pull request from a fork, so its evals can't run here.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::warning::evals don't run on a fork's pull request; a maintainer reruns them from a branch"

  select:
    name: Select suites
    # Pull requests from forks get no secrets; drafts wait until they are ready.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} == workflow_dispatch ]]; then
            candidates="${REQUESTED}"
          else
            candidates="$(git diff --name-only "${BASE_SHA}...HEAD" -- plugins/ | cut -d/ -f2 | sort -u)"
          fi
          selected=()
          for name in ${candidates}; do
            # A changed file directly under plugins/ (a README) or a removed plugin is not a suite.
            if [[ ${EVENT} != workflow_dispatch && ! -f plugins/${name}/.claude-plugin/plugin.json ]]; then
              continue
            fi
            if [[ ! ${name} =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::not a plugin name: ${name}"
              exit 1
            fi
            # Cases may be grouped in nested folders, so search the whole suite; results/ are outputs.
            first_case="$(find "plugins/${name}/evals" -path '*/results' -prune -o \
              \( -name prompt.md -o -name case.yaml \) -print -quit 2>/dev/null || true)"
            if [[ -n ${first_case} ]]; then
              selected+=("${name}")
            elif [[ ${EVENT} == workflow_dispatch ]]; then
              echo "::error::plugins/${name} has no eval suite"
              exit 1
            fi
          done
          echo "Suites: ${selected[*]:-none}"
          plugins="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "plugins=${plugins}" >>"${GITHUB_OUTPUT}"

  eval:
    name: ${{ matrix.plugin }} (effort-${{ matrix.effort }})
    needs: select
    if: needs.select.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    # Worst case: runs ÷ concurrency × each case's timeout_seconds; GitHub's ceiling is 360.
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
        effort: [low, medium, high]
    env:
      PLUGIN: ${{ matrix.plugin }}
      EFFORT: ${{ matrix.effort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A suite with no case tagged for the group would end with "No eval cases found" (exit 1), so
      # each suite folder is listed only when it has one. Tags may be a flow list
      # (`tags: [a, effort-low]`) or a block list (`- effort-low`); Validate's PC-14 makes every case
      # carry exactly one known effort tag, so no case falls outside every group.
      - id: cases
        name: Cases tagged effort-${{ matrix.effort }}
        run: |
          set -euo pipefail
          if jq -e --arg p "${PLUGIN}" '.experimental.evals != null' "plugins/${PLUGIN}/.claude-plugin/plugin.json" >/dev/null; then
            echo "::error::plugins/${PLUGIN} sets experimental.evals, which this workflow doesn't read"
            exit 1
          fi
          suites=()
          total=0
          for dir in "plugins/${PLUGIN}"/evals "plugins/${PLUGIN}"/evals-*; do
            [[ -d ${dir} ]] || continue
            matches="$(find "${dir}" -path '*/results' -prune -o \( -name prompt.md -o -name case.yaml \) \
              -exec grep -lE "^tags:.*\beffort-${EFFORT}\b|^[[:space:]]*-[[:space:]]*['\"]?effort-${EFFORT}['\"]?[[:space:]]*$" {} + || true)"
            count="$(grep -c . <<<"${matches}" || true)"
            echo "${dir}: ${count} case(s) tagged effort-${EFFORT}"
            if ((count > 0)); then
              suites+=("${dir##*/}")
              total=$((total + count))
            fi
          done
          echo "count=${total}" >>"${GITHUB_OUTPUT}"
          echo "suites=${suites[*]}" >>"${GITHUB_OUTPUT}"
      - if: steps.cases.outputs.count != '0'
        uses: ./.github/actions/setup
        with:
          toolchain: evals
      - name: claude plugin eval
        if: steps.cases.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUITES: ${{ steps.cases.outputs.suites }}
        run: |
          set -uo pipefail
          if [[ -z ${CLAUDE_CODE_OAUTH_TOKEN} ]]; then
            echo "::error::the CLAUDE_CODE_OAUTH_TOKEN repository secret is empty or missing"
            exit 1
          fi
          # The owner's subscription pays for evals: each of these outranks the OAuth token
          # (https://code.claude.com/docs/en/authentication#authentication-precedence).
          for var in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_USE_BEDROCK CLAUDE_CODE_USE_VERTEX CLAUDE_CODE_USE_FOUNDRY; do
            if [[ -n ${!var:-} ]]; then
              echo "::error::${var} is set; evals authenticate only with CLAUDE_CODE_OAUTH_TOKEN"
              exit 1
            fi
          done
          OUT="${RUNNER_TEMP}/eval"
          mkdir -p "${OUT}"
          # Fail closed: never run a suite without the flags .github/evals.json gives it.
          flags=0
          jq -r --arg p "${PLUGIN}" '(.[$p] // []) | if type == "array" then .[] else error("not a list") end' \
            .github/evals.json >"${RUNNER_TEMP}/eval-flags" || flags=$?
          if ((flags != 0)); then
            echo "::error::.github/evals.json can't be read for ${PLUGIN} (jq exit ${flags})"
            exit 1
          fi
          mapfile -t extra <"${RUNNER_TEMP}/eval-flags"
          # A suite can add files to the with-plugin arm only, such as an MCP server the plugin doesn't
          # ship: evals/_overlay/ is copied over a temporary copy of the plugin, and the suite runs on
          # that copy. The no-plugin arm never sees it.
          target="plugins/${PLUGIN}"
          if [[ -d ${target}/evals/_overlay ]]; then
            # An overlay adds files and never replaces one the plugin ships, such as its .mcp.json.
            overlay_files="$(find "${target}/evals/_overlay" -type f)" || {
              echo "::error::can't list ${target}/evals/_overlay"
              exit 1
            }
            while IFS= read -r file; do
              if [[ -n ${file} && -e ${target}/${file#"${target}/evals/_overlay/"} ]]; then
                echo "::error::${file} would replace a file the plugin ships"
                exit 1
              fi
            done <<<"${overlay_files}"
            stage="${RUNNER_TEMP}/eval-target"
            if ! { rm -rf "${stage}" && mkdir -p "${stage}" &&
              cp -R "${target}" "${stage}/" &&
              cp -R "${target}/evals/_overlay/." "${stage}/${PLUGIN}/"; }; then
              echo "::error::can't stage ${target} with its evals/_overlay"
              exit 1
            fi
            target="${stage}/${PLUGIN}"
          fi
          # The plugin's gates: a mean-delta floor of at least 0.2 (default 0.2), a cost cap per effort
          # group and suite (default USD 10) and the runs at a time (1 to 8, default 4), from
          # .github/eval-gates.json. Fail closed on a bad entry.
          gate=0
          gates="$(jq -r --arg p "${PLUGIN}" '(if has($p) then .[$p] else {} end) as $g
            | if ($g | type) != "object" then error("not an object") else . end
            | [(if ($g | has("min_mean_delta")) then $g.min_mean_delta else 0.2 end),
               (if ($g | has("max_cost_usd")) then $g.max_cost_usd else 10 end),
               (if ($g | has("concurrency")) then $g.concurrency else 4 end)]
            | if (.[0] | type) == "number" and .[0] >= 0.2 and (.[1] | type) == "number" and .[1] > 0
                and (.[2] | type) == "number" and .[2] >= 1 and .[2] <= 8 and (.[2] | floor) == .[2]
              then "\(.[0]) \(.[1]) \(.[2])"
              else error("min_mean_delta must be at least 0.2, max_cost_usd above 0, concurrency 1 to 8") end' \
            .github/eval-gates.json)" || gate=$?
          if ((gate != 0)); then
            echo "::error::.github/eval-gates.json can't be read for ${PLUGIN} (jq exit ${gate})"
            exit 1
          fi
          read -r min_delta max_cost concurrency <<<"${gates}"
          failed=0
          for suite in ${SUITES}; do
            # evals/ is scored in two arms and gated on the plugin's mean delta; an extra suite such
            # as evals-loading/ runs one arm, since it measures whether a skill loads, not what it adds.
            if [[ ${suite} == evals ]]; then
              arm_flags=()
              delta_flags=(--min-mean-delta "${min_delta}")
            else
              arm_flags=(--eval-dir "${suite}" --ablation none)
              delta_flags=()
            fi
            out="${OUT}/${suite}"
            mkdir -p "${out}"
            echo "::group::${suite}"
            # The target first: --tag takes a list, so a target after it is read as a tag.
            status=0
            CLAUDE_CODE_EFFORT_LEVEL="${EFFORT}" claude plugin eval "${target}" \
              --tag "effort-${EFFORT}" \
              "${arm_flags[@]}" \
              --model claude-sonnet-5-5 \
              --judge-model claude-opus-5-5 \
              --threshold 0.8 \
              --max-cost-usd "${max_cost}" \
              --concurrency "${concurrency}" \
              --trust-plugin \
              --no-publish \
              --output-dir "${out}/report" \
              --json "${out}/result.json" \
              "${extra[@]}" || status=$?
            case "${status}" in
              0)
                # The delta never changes the exit code above, so gate on it from the result.
                uv run python scripts/checkers/eval_gate.py "${out}/result.json" "${delta_flags[@]}" || failed=1
                ;;
              1)
                echo "::error::${suite}: a case scored below 0.8, a case failed to load, no cases were found, a run couldn't start or ended on an API error, the plugin wasn't trusted, an option was invalid, or the result couldn't be written (see stderr)"
                failed=1
                ;;
              2)
                echo "::error::${suite}: partial run: the USD ${max_cost} ceiling was hit or the token was rejected"
                failed=1
                ;;
              130 | 143)
                echo "::error::${suite}: interrupted or terminated (exit ${status}); partial results were written"
                failed=1
                ;;
              *)
                echo "::error::${suite}: claude plugin eval ended with exit ${status}"
                failed=1
                ;;
            esac
            echo "::endgroup::"
          done
          exit "${failed}"
      - if: always() && steps.cases.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.plugin }}-effort-${{ matrix.effort }}
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore
          retention-days: 30
