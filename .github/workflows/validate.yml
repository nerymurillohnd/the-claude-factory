name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducible CI. Dependabot does not track npm CLIs installed with npx/npm -g,
  # so the plugin-consistency skill (WORKFLOW.md, "Skill Triggers") reviews these pins.
  CLAUDE_CODE_VERSION: "2.1.304"
  ACTIONLINT_VERSION: "1.7.12"
  RUFF_VERSION: "0.17.1"
  BIOME_VERSION: "2.5.15"
  MYPY_VERSION: "1.20.2"
  BASEDPYRIGHT_VERSION: "1.40.2"
  UV_VERSION: "0.13.1"
  # tsc for the type check of scripts/, run through npx.
  TYPESCRIPT_VERSION: "6.0.3"
  # shfmt release binary for the shell scripts under scripts/; the checksum pins the exact build.
  SHFMT_VERSION: "3.14.1"
  SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"

# Every job runs one group of scripts/gates.mjs, the commands the maintainers run locally with
# npm run gates. CI checks the maintainer tooling under scripts/ and the plugins' structure; the
# plugins' behavior and the analysis of their code run locally
# (ADR_2026-10-21_ci-checks-maintainer-tooling-and-plugin-structure).
jobs:
  policy:
    name: Maintainer scripts & repository policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Maintainer type packages (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: shellcheck and shfmt
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -sSfL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum --check --strict
          sudo chmod 755 /usr/local/bin/shfmt
          shellcheck --version | head -2
          shfmt --version
      - name: Gates
        env:
          # The PR base on a pull request, the previous head on a push, empty on a manual run.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run gates:ci -- --group policy --base "${BASE}"

  python:
    name: Maintainer Python lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          # No lockfile here: the tool versions are pinned in this workflow's env.
          cache-dependency-glob: .github/workflows/validate.yml
      - name: basedpyright
        run: uv tool install "basedpyright==${BASEDPYRIGHT_VERSION}"
      - name: Gates
        run: npm run gates:ci -- --group python

  claude-validate:
    name: claude plugin validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Gates
        run: npm run gates:ci -- --group claude

  lint:
    name: Workflow & JSON lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: actionlint
        run: |
          curl -sSfL -o download-actionlint.bash "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "${ACTIONLINT_VERSION}" /usr/local/bin
          rm download-actionlint.bash
      - name: Gates
        run: npm run gates:ci -- --group lint
