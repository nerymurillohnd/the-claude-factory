name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each job installs its tools at their latest release, as the maintainer's machine has them, and
  # the gates run them by bare name (ADR_2026-10-21_ci-installs-latest-tools). TypeScript is the one
  # pin: it stays on 6.x, the major the maintainer's machine runs.
  TYPESCRIPT_VERSION: "6.0.3"

# Every job runs one group of scripts/gates.mjs, the commands the maintainers run locally with
# npm run gates. CI checks the maintainer tooling under scripts/ and the plugins' structure; the
# plugins' behavior and the analysis of their code run locally
# (ADR_2026-10-21_ci-checks-maintainer-tooling-and-plugin-structure).
jobs:
  policy:
    name: Maintainer scripts & repository policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Maintainer type packages (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm install --global --no-audit --no-fund "typescript@${TYPESCRIPT_VERSION}"
      - name: shellcheck and shfmt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # The latest shfmt release binary, checked against the digest GitHub records for it.
          asset="$(gh api repos/mvdan/sh/releases/latest \
            --jq '.assets[] | select(.name | endswith("_linux_amd64")) | "\(.browser_download_url) \(.digest)"')"
          read -r url digest <<< "${asset}"
          [[ -n ${url} && ${digest} == sha256:* ]] || { echo "no release asset or digest for mvdan/sh" >&2; exit 1; }
          curl -sSfL -o shfmt "${url}"
          echo "${digest#sha256:}  shfmt" | sha256sum --check --strict
          sudo install -m 755 shfmt /usr/local/bin/shfmt
          rm shfmt
          shellcheck --version | head -2
          shfmt --version
      - name: Gates
        env:
          # The PR base on a pull request, the previous head on a push, empty on a manual run.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run gates:ci -- --group policy --base "${BASE}"

  python:
    name: Maintainer Python lint, types & tests
    runs-on: ubuntu-24.04
    env:
      # uv uses only the Python it installed, and never downloads one on its own: the explicit
      # install below is the only source, as on the maintainer's machine
      # (ADR_2026-10-24_maintainer-python-entry-points-use-a-uv-shebang).
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_DOWNLOADS: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No lockfile and no pins: every run installs the latest tools.
          enable-cache: "false"
      - name: Python 3.15, ruff and basedpyright
        run: |
          uv python install 3.15
          uv tool install ruff
          uv tool install basedpyright
      - name: Gates
        run: npm run gates:ci -- --group python

  claude-validate:
    name: claude plugin validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Claude Code
        run: |
          # Claude Code from Anthropic's signed apt repository, latest channel (the default channel of
          # the native installer). apt checks every package against the release signing key, and the
          # key itself is checked against the fingerprint the setup docs publish
          # (https://code.claude.com/docs/en/setup#install-with-linux-package-managers).
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc
          gpg --show-keys --with-colons /etc/apt/keyrings/claude-code.asc \
            | grep -qx 'fpr:::::::::31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE:' \
            || { echo "unexpected Claude Code signing key" >&2; exit 1; }
          echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/latest latest main" \
            | sudo tee /etc/apt/sources.list.d/claude-code.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq claude-code
          claude --version
      - name: Gates
        run: npm run gates:ci -- --group claude

  lint:
    name: Workflow & JSON lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest actionlint release, checked against the digest GitHub records for it.
          asset="$(gh api repos/rhysd/actionlint/releases/latest \
            --jq '.assets[] | select(.name | endswith("_linux_amd64.tar.gz")) | "\(.browser_download_url) \(.digest)"')"
          read -r url digest <<< "${asset}"
          [[ -n ${url} && ${digest} == sha256:* ]] || { echo "no release asset or digest for rhysd/actionlint" >&2; exit 1; }
          curl -sSfL -o actionlint.tar.gz "${url}"
          echo "${digest#sha256:}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 755 actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tar.gz
          actionlint --version
      - name: Biome
        run: npm install --global --no-audit --no-fund @biomejs/biome
      - name: Gates
        run: npm run gates:ci -- --group lint
