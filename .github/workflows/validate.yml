name: Validate

# The merge gate. On every pull request, and on every push to main, `checks` runs every check that
# passes today and blocks on any failure; `debt` runs the checks that a logged technical-debt item
# holds back and never blocks. On a push to main, once `checks` passes, `release` calls release.yml,
# which tags and publishes each plugin whose current version has no tag yet.
# A check moves from `debt` to `checks` when its DEBT item closes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A pull request keeps only its newest run. Every push to main gets its own run, never cancelled,
# so each merged commit is checked and released.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      # Every check runs once the toolchain is in place, so one run reports each failing check. Each
      # step runs its pr-checks.sh step, the source it shares with `npm run check:pr`.
      - name: Lint (Python, shell, workflows, GitHub files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh lint
      # lint:js is held back by DEBT-006 in `debt`; this gates the files the pull request changed.
      - name: Biome on changed files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/validators/pr-checks.sh biome-changed
      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh typecheck
      - name: Maintainer script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh test-scripts
      - name: Plugin hook tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh test-plugins
      - name: claude plugin validate --strict (plugins outside DEBT-003, the marketplace, .claude)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh validate
      - name: Mod tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh mods
      # A pull request is checked as main will be after the merge: an empty [Unreleased] (PC-05,
      # --main) and a dated section for every current version. Otherwise the push to main fails
      # Checks and its Release job never runs.
      - name: Consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh consistency
      # Each plugin's Release body must build: release.yml stops at the first plugin whose notes
      # are missing. Every plugin is checked, and every failure is reported.
      - name: Release notes for every plugin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/validators/pr-checks.sh release-notes
      # A DEBT-003 plugin is still installed, loaded and tested here; only its strict validation
      # waits in `debt`.
      - name: Install check for each changed plugin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/validators/pr-checks.sh install

  debt:
    name: Debt (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: DEBT-006 — npm run lint:js
        continue-on-error: true
        run: npm run lint:js
      - name: DEBT-005 — npm run lint:frontmatter
        continue-on-error: true
        run: npm run lint:frontmatter
      - name: DEBT-003 — claude plugin validate --strict on the five plugins
        continue-on-error: true
        run: bash scripts/validators/pr-checks.sh debt-validate
      - name: DEBT-003 — npm run validate:portable
        continue-on-error: true
        run: npm run validate:portable
      - name: DEBT-003 — npm run validate:hooks-catch
        continue-on-error: true
        run: npm run validate:hooks-catch

  release:
    name: Release
    if: github.event_name == 'push'
    needs: checks
    permissions:
      contents: write # release.yml creates the tags and the Releases
      checks: read # release.yml reads Checks when it is dispatched by hand
    uses: ./.github/workflows/release.yml
