name: Validate

# The merge gate. On every pull request, and on every push to main, `checks` runs every check that
# passes today and blocks on any failure; `floors` runs every plugin's tests on the lowest Python
# and Node.js that plugin code supports and blocks on any failure; `debt` runs the checks that a
# logged technical-debt item holds back and never blocks. On a push to main, once `checks` and
# `floors` pass, `release` calls release.yml,
# which tags and publishes each plugin whose current version has no tag yet.
# A check moves from `debt` to `checks` when its DEBT item closes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A pull request keeps only its newest run. Every push to main gets its own run, never cancelled,
# so each merged commit is checked and released.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      # Every check runs once the toolchain is in place, so one run reports each failing check. Each
      # step runs its pr-checks.sh step, the source it shares with `npm run check:pr`.
      - name: Lint (Biome, Python, shell, workflows, GitHub files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh lint
      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh typecheck
      - name: Maintainer script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh test-scripts
      - name: Plugin hook tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh test-plugins
      - name: claude plugin validate --strict (every plugin, the marketplace, .claude), portable and hooks-catch
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh validate
      - name: Mod tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh mods
      # A pull request is checked as main will be after the merge: an empty [Unreleased] (PC-05,
      # --main) and a dated section for every current version. Otherwise the push to main fails
      # Checks and its Release job never runs.
      - name: Consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh consistency
      # Each plugin's Release body must build: release.yml stops at the first plugin whose notes
      # are missing. Every plugin is checked, and every failure is reported.
      - name: Release notes for every plugin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/checks/pr-checks.sh release-notes
      - name: Install check for each changed plugin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/checks/pr-checks.sh install
      # The URLs in the files the pull request adds or changes must answer (404, 410 or no
      # connection fails); the weekly Links workflow checks every file.
      - name: Live URLs in changed files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/checks/pr-checks.sh links

  # Plugin code runs on users' python3 and node from Python 3.12 and Node.js 24, while `checks`
  # runs on the maintainers' Python 3.15 and Node 26. This job sets up the same toolchain, puts the
  # floor runtimes first on PATH and runs every plugin's tests on them. plugins.sh runs bare python3
  # and node; npm stays out, since the root devEngines rejects Node 24 and its npm.
  floors:
    name: Floors (Python 3.12, Node.js 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Python 3.12 first on PATH
        run: |
          set -euo pipefail
          uv python install 3.12
          python="$(uv python find 3.12)"
          dirname "${python}" >> "${GITHUB_PATH}"
      - name: Check the floor runtimes
        run: |
          set -euo pipefail
          python3 -c 'import sys; v = sys.version_info[:2]; print(sys.version); sys.exit(v != (3, 12))'
          node -e 'console.log(process.version); process.exit(process.versions.node.split(".")[0] === "24" ? 0 : 1)'
      - name: Plugin tests on the floors
        run: bash scripts/checks/plugins.sh tests

  debt:
    name: Debt (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: DEBT-005 — npm run lint:frontmatter
        continue-on-error: true
        run: npm run lint:frontmatter

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [checks, floors]
    permissions:
      contents: write # release.yml creates the tags and the Releases
      checks: read # release.yml reads Checks when it is dispatched by hand
    uses: ./.github/workflows/release.yml
