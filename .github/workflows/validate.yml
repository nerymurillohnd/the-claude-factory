name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Pinned for reproducible CI. Dependabot does not track npm CLIs installed with npx/npm -g,
  # so the docs-drift-check skill reviews these pins.
  CLAUDE_CODE_VERSION: "2.1.296"
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  ACTIONLINT_VERSION: "1.7.12"
  RUFF_VERSION: "0.14.0"
  MYPY_VERSION: "1.18.2"

jobs:
  policy:
    name: Repository policy & script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Script tests
        run: node --test ".github/scripts/tests/*.test.mjs"
      - name: Repository policy
        run: node .github/scripts/check-repo.mjs
      - name: Catalog in sync
        run: node .github/scripts/catalog.mjs --check
      - name: Version bumps
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No comparable base commit; skipping version-bump check."
            exit 0
          fi
          node .github/scripts/check-version-bump.mjs "$base"

  python:
    name: Plugin Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (every plugin's Python suite)
        shell: bash
        run: |
          found=0
          for dir in .github/scripts/tests/*/; do
            ls "$dir"test_*.py >/dev/null 2>&1 || continue
            found=1
            echo "::group::$dir"
            python -m unittest discover -s "$dir" -v
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "No plugin Python tests found"; exit 1; }

  python-lint:
    name: Python lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: ruff and mypy
        run: |
          python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"
          ruff check --config .github/scripts/ruff.toml plugins .github/scripts
          ruff format --check --config .github/scripts/ruff.toml plugins .github/scripts
          mypy --python-version 3.9 --strict plugins/*/skills/*/scripts/*.py plugins/*/hooks/*.py

  claude-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace and plugins
        run: .github/scripts/validate-claude.sh

  lint:
    name: Markdown & workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: markdownlint
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
      - name: actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color
