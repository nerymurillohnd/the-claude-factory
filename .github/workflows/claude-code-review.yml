name: Claude Code Review

# Claude reviews every pull request when it opens and after every push to it, following the
# "Automatic PR Code Review" example in anthropics/claude-code-action (docs/solutions.md). Anthropic's
# code-review plugin is not used here: it stops on a pull request Claude has already commented on, so
# it can't review the later pushes. The review covers only what Validate's scripts can't see; the
# prompt below sets that scope. It authenticates with the ANTHROPIC_API_KEY secret of the `claude`
# environment, and runs only when the repository variable CLAUDE_CODE_REVIEW is `enabled`, so it
# stays off until that secret exists.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A newer push replaces the review still running for an older one.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Drafts wait until they are ready. Pull requests from forks and from Dependabot get no
    # secrets, and the action refuses bots.
    if: >-
      vars.CLAUDE_CODE_REVIEW == 'enabled' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The secret lives in the `claude` environment, so only jobs that name it can read it.
    environment: claude
    permissions:
      contents: read # Claude reads the checked-out code
      pull-requests: write # Claude posts its inline comments and its summary on the pull request
      issues: read # Claude reads the pull request's conversation
      id-token: write # the action's default GitHub App authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The pull request's branch is checked out in the working directory.

            Validate, this repository's CI, already runs every linter, type checker, test, `claude plugin
            validate` and `npm run check:consistency`. Never report anything those catch: formatting,
            style, types, schema, missing files, names or catalog rows. Report only what they can't see:
            1. Bugs and logic errors in the changed lines: wrong behavior, broken edge cases, unsafe shell
               or Python, a hook that blocks or allows the wrong call, a script that can damage a user's files.
            2. Breaches of `.claude/CLAUDE.md` and of the rules in `.claude/rules/` that apply to the changed
               paths. Read them first, and cite the rule file and line in each finding.
            3. A change inside `plugins/<plugin>/` with no version bump in its `plugin.json`, or a bump of the
               wrong semver level for what changed.
            4. A README, CHANGELOG, manifest description or skill text that the change makes untrue.

            Before you post, read the comments already on the pull request with `gh pr view --comments`.
            Don't repeat a finding that is already posted. On a later push, say which earlier findings the
            new commits fixed.

            Report a finding only when you can point to the line and explain the failure it causes. When
            nothing qualifies, say so in the summary.

            Post each finding with `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) on its line. Then post one summary for this push with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`, starting with
            "Claude review of <the head commit's short SHA>". Never edit an earlier comment: replies to
            @claude mentions come from the same account. Only post GitHub comments; don't return the
            review as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
