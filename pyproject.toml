# Maintainer Python tooling only. This repository is not a Python package: nothing here is built,
# installed or shipped to plugin users. Plugin scripts declare their own dependencies inline
# (PEP 723), and uv ignores this project when it runs them.
[project]
name = "the-claude-factory-maintainer"
version = "0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "ruff==0.17.4",
    "zizmor==1.32.0",
]

[tool.uv]
package = false
required-version = ">=0.13.7,<0.14"
