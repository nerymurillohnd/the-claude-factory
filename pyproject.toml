# The maintainer scripts' Python environment (.venv, Python from .python-version). This repository
# is not a Python package: nothing here is built, installed or shipped to plugin users. Plugin
# scripts use only the standard library and run with the user's own python3.
[project]
name = "the-claude-factory-maintainer"
version = "0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
# Only the packages that the maintainer scripts in scripts/ import. The maintainer tools
# (ruff, basedpyright, zizmor, check-jsonschema) are uv tools, pinned in the tools:install
# npm script.
dev = [
    "ruamel.yaml==0.19.1",
]

[tool.uv]
package = false
required-version = ">=0.13.7,<0.14"
