# Dependabot version updates. Write to .github/dependabot.yml (or .yaml).
# Keep the GitHub Actions entry when the repository has workflows, and add one entry per
# package ecosystem its manifests use (references/dependabot.md maps manifests to values).
# Add cooldown, groups, commit-message and the other optional keys only when the user chose
# them. Every custom label named here must exist: the labels step creates them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "type: dependencies"
      - "area: ci"
