# Feature request form (GitHub issue forms schema). Public and internal repositories.
# `labels:` is static; triage applies component and priority labels by hand.
# GitHub serves forms from the default branch, so a change goes live once merged there.
name: ✨ Feature request
description: Suggest an improvement to something that already exists.
title: "[Feature] <component>: <short summary>"
labels: ["type: enhancement", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Great ideas start with a real problem. Tell us what slows you down and we will work out the best way to solve it.
        Have an idea for something **brand new**? Use [Idea](https://github.com/<OWNER>/<REPO>/issues/new?template=idea.yml) instead.

  - type: input
    id: component
    attributes:
      label: Component
      description: The plugin, package, page or service this is about.
      placeholder: e.g. checkout, api
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why it falls short today.
      placeholder: Every time I …, I have to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you want. Examples of commands, screens or output help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use today, or other tools that do this well.

  - type: dropdown
    id: importance
    attributes:
      label: How much does this matter?
      description: Triage maps this to a priority.
      options:
        - Nice to have
        - Important, I have a workaround
        - It blocks my work
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
