default_stages: [pre-commit]

repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-ci
        args: [--error-on-warnings]
        additional_dependencies: ["@biomejs/biome@2.5.15"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        args: [--check]
        types_or: [python, pyi]

  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: 1.40.2
    hooks:
      - id: basedpyright
        args: [--warnings]

  - repo: local
    hooks:
      - id: shfmt
        name: Shell formatting
        entry: shfmt -d
        language: unsupported
        types: [shell]
        exclude_types: [zsh, csh, tcsh]
        require_serial: true

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        args: [--rcfile=.shellcheckrc, --severity=style, --check-sourced]
        language: unsupported
        types: [shell]
        exclude_types: [zsh, csh, tcsh]
        require_serial: true

      - id: tsc-showconfig
        name: TypeScript config resolves
        entry: npx --yes --package typescript@6.0.3 tsc -p .github/scripts/tsconfig.json --showConfig
        language: unsupported
        files: ^(\.github/scripts/tsconfig\.json|tsconfig\.base\.json)$
        pass_filenames: false
        require_serial: true

      - id: tsc-noemit
        name: TypeScript type-check
        entry: npx --yes --package typescript@6.0.3 tsc -p .github/scripts/tsconfig.json --noEmit
        language: unsupported
        files: ^((\.github/scripts|plugins)/.*\.mjs|\.github/scripts/tsconfig\.json|tsconfig\.base\.json|package(-lock)?\.json)$
        pass_filenames: false
        require_serial: true
