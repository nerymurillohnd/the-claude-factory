# Full plugin eval suite, only for plugins that have evals AND are new or had a
# component or dependency changed. Every other plugin is skipped.
# Template: copy to .github/workflows/evals.yml and adapt the three TODO values.
# If the repo already has an eval workflow, audit it against the checklist in
# references/eval-policy.md instead of adding this one.
name: plugin-evals

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ["plugins/**"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory name to run (bypasses new/edited detection)"
        required: true

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          ONLY: ${{ inputs.plugin }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${ONLY:-}" ]]; then
            names="${ONLY}"
          else
            listed="$(bash scripts/changed-eval-plugins.sh "${BASE}" "${HEAD}" plugins evals)"
            names="$(cut -f1 <<< "${listed}")"
          fi
          # A name reaches a path and a matrix value: accept only a plugin folder name with evals.
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            [[ "${name}" =~ ^[a-z0-9-]+$ ]] || { echo "invalid plugin name: ${name}" >&2; exit 1; }
            test -d "plugins/${name}/evals" || { echo "plugins/${name}/evals not found" >&2; exit 1; }
          done <<< "${names}"
          matrix="$(jq -R -s -c 'split("\n") | map(select(length>0))' <<< "${names}")"
          any=true
          [[ "${matrix}" == "[]" ]] && any=false
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "any=${any}" >> "${GITHUB_OUTPUT}"
          echo "Targets: ${matrix}"

  evals:
    needs: targets
    if: >-
      needs.targets.outputs.any == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      # TODO 1: pin these as repository variables so a model rollout is not mistaken for a regression
      EVAL_MODEL: ${{ vars.EVAL_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      # TODO 2: per-plugin ceiling in USD
      MAX_COST_USD: "20"
      # TODO 3: pin the Claude Code version (>= 2.1.269 is required for plugin eval)
      CLAUDE_CODE_VERSION: "2.1.310"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        # The native installer, which /en/setup recommends, at the pinned version
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "${CLAUDE_CODE_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run the full suite
        run: |
          set -euo pipefail
          test -n "${CLAUDE_CODE_OAUTH_TOKEN}" || { echo "CLAUDE_CODE_OAUTH_TOKEN is not set" >&2; exit 1; }
          mkdir -p eval-results
          # --trust-plugin and --scaffold: the docs allow them for suites you or your organization wrote
          claude plugin eval "plugins/${PLUGIN}" \
            --trust-plugin \
            --scaffold \
            --json "eval-results/${PLUGIN}.json" \
            --report "eval-results/${PLUGIN}.html" \
            --threshold 0.8 \
            --model "${EVAL_MODEL}" \
            --judge-model "${EVAL_JUDGE_MODEL}" \
            --no-publish \
            --max-cost-usd "${MAX_COST_USD}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ matrix.plugin }}
          path: eval-results/
          if-no-files-found: ignore

  fork-notice:
    # Secrets are not available to PRs from forks, so the suite cannot run there.
    # Say so loudly instead of passing silently; a maintainer re-runs it with workflow_dispatch.
    needs: targets
    if: >-
      needs.targets.outputs.any == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          TARGETS: ${{ needs.targets.outputs.matrix }}
        run: |
          echo "::warning::Eval suite skipped: this PR comes from a fork and has no access to secrets. A maintainer should review the code, then run this workflow manually (workflow_dispatch) for: ${TARGETS}"
