<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">The Claude Factory</title>
  <desc id="desc">A plugin marketplace for Claude Code and Cowork, illustrated with a factory skyline and turning gears.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1B18"/>
      <stop offset="1" stop-color="#2D2420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#F0A35E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <g id="gear">
      <path d="M0-30l5 0 2 7 6 3 7-3 4 4-3 7 3 6 7 2v6l-7 2-3 6 3 7-4 4-7-3-6 3-2 7h-6l-2-7-6-3-7 3-4-4 3-7-3-6-7-2v-6l7-2 3-6-3-7 4-4 7 3 6-3 2-7z" transform="translate(0 0) scale(1)"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Factory skyline -->
  <g fill="#3A302A">
    <rect x="860" y="150" width="34" height="120"/>
    <rect x="910" y="110" width="34" height="160"/>
    <path d="M960 270V190l70 40v-40l70 40v-40l70 40v80z"/>
    <rect x="0" y="270" width="1280" height="50"/>
  </g>
  <g fill="#F0A35E" fill-opacity="0.85">
    <rect x="990" y="235" width="16" height="16" rx="2"/>
    <rect x="1060" y="235" width="16" height="16" rx="2"/>
    <rect x="1130" y="235" width="16" height="16" rx="2"/>
  </g>
  <!-- Smoke -->
  <g fill="#FFFFFF" fill-opacity="0.08">
    <circle cx="877" cy="128" r="14"/>
    <circle cx="896" cy="104" r="18"/>
    <circle cx="927" cy="86" r="16"/>
    <circle cx="952" cy="62" r="22"/>
  </g>

  <!-- Gears -->
  <g fill="url(#accent)">
    <g transform="translate(1180 110)">
      <use href="#gear"/>
      <circle r="10" fill="#1F1B18"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1222 160) scale(0.6)">
      <use href="#gear"/>
      <circle r="10" fill="#1F1B18"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#F5EFE9" font-size="64" font-weight="800" letter-spacing="-1">The Claude Factory</text>
    <rect x="74" y="152" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="204" fill="#CDBFB4" font-size="26" font-weight="500">Plugins for Claude Code &amp; Cowork</text>
    <text x="72" y="244" fill="#9C8D82" font-size="20">skills · agents · hooks · MCP · LSP · output styles</text>
  </g>
  </g>
</svg>
