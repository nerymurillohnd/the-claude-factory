# Ruff + basedpyright
required-version = ">=0.17.4,<0.18"

line-length = 100
indent-width = 4

# Maintainer Python, the release scripts included, runs on 3.15 through uv run, in release.yml too.
# Plugin Python runs on any python3 from the floor up (3.12).
target-version = "py315"
per-file-target-version = { "plugins/**/*.py" = "py312", ".claude/skills/**/*.py" = "py312" }

respect-gitignore = true
force-exclude = true
# This repository: .github/ is never linted or formatted (node_modules is git-ignored).
extend-exclude = [".github"]

# Explicit, not implicit: preview rules, fixes and formatter style change between patch
# releases and are not a quality gate. `ruff check --preview` still opts in per run.
preview = false

[lint]
# select = [...]  # See the Default Rules page for the full listing.
select = ["ALL"]
ignore = [
    # Each check has one owner. basedpyright (pyrightconfig.json, typeCheckingMode "all") owns
    # type-aware checks, and Ruff ignores its own copy of them. Ruff owns the lint checks that both
    # report, and pyrightconfig.json turns basedpyright's copy off.

    # === Owned by basedpyright ===

    # flake8-annotations: basedpyright owns parameter annotations and Any. The return-annotation
    # rules (ANN201-ANN206) stay on: basedpyright has no missing-return-annotation rule.
    "ANN001",  # missing-type-function-argument -> reportMissingParameterType
    "ANN002",  # missing-type-args -> reportMissingParameterType
    "ANN003",  # missing-type-kwargs -> reportMissingParameterType
    "ANN401",  # any-type -> reportExplicitAny
    "RUF013",  # implicit-optional -> strictParameterNoneValue, reported as reportArgumentType
    "RUF016",  # invalid-index-type -> reportCallIssue and reportArgumentType
    "PLE0604", # invalid-all-object -> reportUnsupportedDunderAll
    "PLE0605", # invalid-all-format -> reportUnsupportedDunderAll
    "F822",    # undefined-export -> reportUnsupportedDunderAll
    "F811",    # redefined-while-unused -> reportRedeclaration and reportDuplicateImport
    "N804",    # invalid-first-argument-name-for-class-method -> reportSelfClsParameterName
    "N805",    # invalid-first-argument-name-for-method -> reportSelfClsParameterName
    "SLF001",  # private-member-access -> reportPrivateUsage (type-aware, allows subclasses)
    "ISC001",  # single-line-implicit-string-concatenation -> reportImplicitStringConcatenation
    "ISC002",  # multi-line-implicit-string-concatenation -> reportImplicitStringConcatenation
    "ISC004",  # implicit concat in collection literal -> reportImplicitStringConcatenation

    # === Conflicts with the Ruff formatter (docs/formatter.md, "Conflicting lint rules") ===

    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "Q004",   # unnecessary-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma

    # === Project policy ===

    "CPY001", # missing-copyright-notice: each plugin's LICENSE carries the notice
    "S603",   # subprocess-without-shell-equals-true: fires on every subprocess call

    # === Not used: pytest ===

    # pytest is not part of this repository, so flake8-pytest-style is left out of "ALL". Its
    # PT009 and PT027 would demand pytest's bare assert and pytest.raises over TestCase.assert*
    # (bare assert is S101, which stays on: -O strips it).
    "PT", # flake8-pytest-style
]

# Every enabled rule may be fixed when `--fix` is passed.
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# hyphenated entry script run by path, never imported
"scripts/validators/skill-lint.py" = ["N999"]
"scripts/validators/plugin-consistency.py" = ["N999"]
"scripts/validators/frontmatter-lint.py" = ["N999"]
"scripts/release/release-*.py" = ["N999"]

[lint.isort]

force-sort-within-sections = true
combine-as-imports = true
order-by-type = true

[lint.mccabe]

max-complexity = 8

[lint.pydocstyle]

convention = "google"

[lint.flake8-tidy-imports]

ban-relative-imports = "all"

[lint.pycodestyle]

max-doc-length = 100
ignore-overlong-task-comments = true

[format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Enable auto-formatting of code examples in docstrings.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in docstrings.
docstring-code-line-length = 100

# Exclude formatting markdown files.
exclude = ["*.md"]

# LF everywhere, as .editorconfig's end_of_line; "auto" would keep a file's CRLF.
line-ending = "lf"
